
trigger:
  branches:
    include:
      - main

pool:
  name: CloudNative-Local-Agent

variables:
  azureServiceConnection: 'sc-cloudnative-platform-azure'
  resourceGroup: 'rg-cloudnative-platform-dev'
  aksCluster: 'aks-cloudnative-platform'
  acrName: 'manufacturingai1993'
  acrLoginServer: 'manufacturingai1993.azurecr.io'
  imageRepository: 'cloudnative-analytics-api'
  namespace: 'cloudnative-platform'

steps:
- task: AzureCLI@2
  displayName: 'Build and Push Analytics API'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: ps
    scriptLocation: inlineScript
    inlineScript: |
      $ErrorActionPreference = "Stop"
      $image = "$(acrLoginServer)/$(imageRepository)"
      $tag = "$(Build.BuildId)"

      Write-Host "Building Docker image..."
      docker build -f src/Analytics.Api/Dockerfile -t "${image}:${tag}" src/Analytics.Api
      if ($LASTEXITCODE -ne 0) { throw "Docker build failed" }

      az acr login --name "$(acrName)"
      if ($LASTEXITCODE -ne 0) { throw "ACR login failed" }

      docker push "${image}:${tag}"
      if ($LASTEXITCODE -ne 0) { throw "Docker push failed" }

- task: AzureCLI@2
  displayName: 'Deploy Analytics API to AKS'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: ps
    scriptLocation: inlineScript
    inlineScript: |
      $ErrorActionPreference = "Stop"

      az aks get-credentials `
        --resource-group "$(resourceGroup)" `
        --name "$(aksCluster)" `
        --overwrite-existing `
        --format exec
      if ($LASTEXITCODE -ne 0) { throw "AKS credentials failed" }

      kubelogin convert-kubeconfig -l azurecli
      if ($LASTEXITCODE -ne 0) { throw "kubelogin conversion failed" }

      kubectl apply -f infrastructure/kubernetes/analytics/deployment.yaml -f infrastructure/kubernetes/analytics/service.yaml -n "$(namespace)"
      if ($LASTEXITCODE -ne 0) { throw "Manifest application failed" }

      $image = "$(acrLoginServer)/$(imageRepository):$(Build.BuildId)"
      kubectl set image deployment/analytics-api analytics-api=$image -n "$(namespace)"
      if ($LASTEXITCODE -ne 0) { throw "Image update failed" }

      kubectl rollout status deployment/analytics-api -n "$(namespace)" --timeout=180s
      if ($LASTEXITCODE -ne 0) { throw "Deployment rollout failed" }

      kubectl get deployment analytics-api -n "$(namespace)"
      kubectl get pods -n "$(namespace)"
