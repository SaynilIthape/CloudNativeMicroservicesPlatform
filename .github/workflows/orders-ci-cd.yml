
name: Orders API CI-CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/Orders.Api/**'
      - 'infrastructure/kubernetes/orders/**'
      - '.github/workflows/orders-ci-cd.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: manufacturingai1993
  IMAGE_NAME: cloudnative-orders-api
  RESOURCE_GROUP: rg-cloudnative-platform-dev
  AKS_CLUSTER: aks-cloudnative-platform
  NAMESPACE: cloudnative-platform
  DEPLOYMENT: orders-api
  CONTAINER: orders-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build \
            -f src/Orders.Api/Dockerfile \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG \
            .

      - name: Push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

      - name: Install kubectl
        run: az aks install-cli

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --overwrite-existing

      - name: Deploy Orders API
        run: |
          IMAGE_TAG=${GITHUB_SHA}

          kubectl set image deployment/$DEPLOYMENT \
            $CONTAINER=$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG \
            -n $NAMESPACE

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/$DEPLOYMENT \
            -n $NAMESPACE \
            --timeout=180s

          kubectl get pods -n $NAMESPACE -l app=orders-api
